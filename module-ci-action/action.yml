name: "Facets Module CI"
description: "CI for a Facets modules repo (modules/{intent}/{flavor}/{version}): preview on PR, publish on push, cleanup on PR close — driven by the raptor CLI."
author: "Facets"

inputs:
  control_plane_url:
    description: "Facets Control Plane URL (provisioned as the CONTROL_PLANE_URL secret)."
    required: true
  username:
    description: "Facets username (provisioned as the FACETS_USERNAME secret)."
    required: true
  token:
    description: "Facets API token (provisioned as the FACETS_TOKEN secret)."
    required: true
  github_token:
    description: "GitHub token. Optional; enables the PR preview comment and reading the PR's commit SHAs for ownership-checked cleanup. When absent, those features are skipped."
    required: false
    default: ""
  raptor_version:
    description: "raptor CLI version to install: 'latest' or an exact release tag. Ignored when raptor-download-url is set."
    required: false
    default: "latest"
  raptor-download-url:
    description: "Exact URL to download the raptor linux-amd64 binary from, bypassing the default location."
    required: false
    default: ""
  terraform-version:
    description: "Terraform version for raptor's module validation."
    required: false
    default: "1.5.7"
  trivy-version:
    description: "Trivy version for raptor's module security scan (no 'v' prefix)."
    required: false
    default: "0.72.0"
  all-modules:
    description: "When 'true', operate on every module and output type, not only the ones changed by the triggering event."
    required: false
    default: "false"
  apply-output-types:
    description: "When 'true' (default), apply the output type definitions under outputs/ before any module."
    required: false
    default: "true"
  mode:
    description: "One of auto|preview|publish|cleanup. 'auto' derives the mode from the event."
    required: false
    default: "auto"
  path-prefix:
    description: "Sub-path to the modules/ tree, relative to the repo root. Empty means modules/ is at the repo root."
    required: false
    default: ""
  auto-create-intents:
    description: "When 'true' (default), pass --auto-create so a module whose intent does not yet exist creates it."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Resolve CI mode and map event to the generic contract
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
      run: |
        set -euo pipefail
        MODE="${INPUT_MODE:-auto}"
        if [ "$MODE" = "auto" ] || [ -z "$MODE" ]; then
          case "$EVENT_NAME" in
            pull_request) if [ "$EVENT_ACTION" = "closed" ]; then MODE="cleanup"; else MODE="preview"; fi ;;
            push) MODE="publish" ;;
            pull_request_target)
              echo "::error::pull_request_target is not supported — it checks out the BASE ref, so the changed-file diff is empty and git provenance is wrong. Use a 'pull_request' trigger instead."; exit 1 ;;
            *) echo "::error::Cannot derive mode from event '${EVENT_NAME}'. Set the 'mode' input explicitly."; exit 1 ;;
          esac
        fi
        case "$MODE" in preview|publish|cleanup) ;; *) echo "::error::Invalid mode '${MODE}'."; exit 1 ;; esac
        # A merged-PR close is handled by the concurrent push (publish) run; cleanup would be redundant and racy.
        if [ "$MODE" = "cleanup" ] && [ "$PR_MERGED" = "true" ]; then
          echo "PR merged — the publish run owns the preview slot; nothing to clean."; MODE="noop"
        fi
        # Form the generic git diff range: push -> BEFORE..AFTER (empty when the before-SHA is
        # absent/unreachable, so the core falls back to the pushed commit's own tree); PR -> BASE...HEAD.
        RANGE=""
        if [ "$EVENT_NAME" = "push" ]; then
          if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null 2>&1; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          fi
        elif [ "$EVENT_NAME" = "pull_request" ]; then
          RANGE="${PR_BASE_SHA}...HEAD"
        fi
        echo "Resolved mode: ${MODE} (event=${EVENT_NAME}, action=${EVENT_ACTION:-none})"
        {
          echo "MODE=${MODE}"
          echo "MC_DIFF_RANGE=${RANGE}"
          echo "MC_HEAD_SHA=${PR_HEAD_SHA}"
        } >> "$GITHUB_ENV"

    - name: Resolve preview ownership SHAs (cleanup)
      if: env.MODE == 'cleanup' && inputs.github_token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail
        SHAS="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq '.[].sha' 2>/dev/null || true)"
        # Multi-line value: GITHUB_ENV heredoc form.
        {
          echo "MC_OWNER_SHAS<<__EOF__"
          printf '%s\n' "$SHAS"
          echo "__EOF__"
        } >> "$GITHUB_ENV"

    - name: Run Facets Module CI core
      shell: bash
      env:
        CONTROL_PLANE_URL: ${{ inputs.control_plane_url }}
        FACETS_USERNAME: ${{ inputs.username }}
        FACETS_TOKEN: ${{ inputs.token }}
        PATH_PREFIX: ${{ inputs.path-prefix }}
        ALL_MODULES: ${{ inputs.all-modules }}
        APPLY_OUTPUT_TYPES: ${{ inputs.apply-output-types }}
        AUTO_CREATE_INTENTS: ${{ inputs.auto-create-intents }}
        RAPTOR_VERSION: ${{ inputs.raptor_version }}
        RAPTOR_DOWNLOAD_URL: ${{ inputs.raptor-download-url }}
        TERRAFORM_VERSION: ${{ inputs.terraform-version }}
        TRIVY_VERSION: ${{ inputs.trivy-version }}
        MC_COMMENT_DIR: ${{ runner.temp }}
      run: bash "${{ github.action_path }}/../module-ci-core.sh"

    - name: Upsert preview PR comment
      # always(): the core gates (fails) on a bad module, but the preview comment must still post
      # so the PR shows what was (attempted to be) previewed.
      if: ${{ always() && env.MODE == 'preview' && inputs.github_token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MC_COMMENT_DIR: ${{ runner.temp }}
      run: |
        set -uo pipefail
        BODY="${RUNNER_TEMP}/preview_comment.md"
        MODULES_SECTION="${MC_COMMENT_DIR}/preview_modules.md"
        OUTPUTS_SECTION="${MC_COMMENT_DIR}/preview_outputs.md"
        echo "<!-- facets-module-ci:preview -->" > "$BODY"
        [ -f "$OUTPUTS_SECTION" ] && { cat "$OUTPUTS_SECTION" >> "$BODY"; echo "" >> "$BODY"; }
        [ -f "$MODULES_SECTION" ] && cat "$MODULES_SECTION" >> "$BODY"
        if [ ! -f "$MODULES_SECTION" ] && [ ! -f "$OUTPUTS_SECTION" ]; then
          echo "No preview comment body found; nothing to post."; exit 0
        fi
        MARKER="facets-module-ci:preview"
        EXISTING="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" 2>/dev/null | head -n1 || true)"
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${EXISTING}" -F body=@"$BODY" >/dev/null
        else
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@"$BODY" >/dev/null
        fi
